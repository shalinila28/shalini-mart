# ==========================================
# DATABASE CONFIGURATION (Localhost with Fallbacks)
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/shalinimart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# SERVER PORT
# ==========================================
server.port=${PORT:8080}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# COOKIES / SESSION CONFIG
# ==========================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax